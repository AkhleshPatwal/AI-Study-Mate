<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glowing Rim -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.9" />
    </linearGradient>

    <!-- Star Glow -->
    <linearGradient id="starGrad" x1="256" y1="110" x2="256" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Pages Gradient -->
    <linearGradient id="pageLeft" x1="100" y1="240" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <linearGradient id="pageRight" x1="412" y1="240" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Hologram/Accent Gradient -->
    <linearGradient id="holoGrad" x1="200" y1="200" x2="312" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312E81" flood-opacity="0.45" />
    </filter>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#iconShadow)" />
  <rect x="26" y="26" width="460" height="460" rx="110" stroke="url(#rimGrad)" stroke-width="4" stroke-opacity="0.6" fill="none" />

  <!-- Subtle Inner Diagonal Reflection -->
  <path d="M48 136 C136 60, 376 48, 464 136 L464 48 C464 36, 452 24, 440 24 L136 24 C48 48, 48 100, 48 136 Z" fill="#FFFFFF" fill-opacity="0.08" />

  <!-- Digital Circuit Lines / AI Rays -->
  <g opacity="0.35">
    <circle cx="256" cy="180" r="100" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 8" />
    <circle cx="256" cy="180" r="140" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 12" />
    <line x1="256" y1="60" x2="256" y2="100" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="150" y1="100" x2="180" y2="130" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="362" y1="100" x2="332" y2="130" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Open Book Base / Pages -->
  <g filter="url(#iconShadow)">
    <!-- Book Backing Shadow -->
    <path d="M100 376 C160 350, 220 360, 256 388 C292 360, 352 350, 412 376 L404 246 C350 220, 292 230, 256 256 C220 230, 162 220, 108 246 Z" fill="#312E81" opacity="0.5" />

    <!-- Left Book Page -->
    <path d="M104 366 C160 340, 218 350, 256 376 L256 246 C218 220, 160 210, 104 236 Z" fill="url(#pageLeft)" />
    <!-- Left Page Subtle Lines -->
    <line x1="130" y1="265" x2="230" y2="250" stroke="#C7D2FE" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <line x1="130" y1="290" x2="225" y2="275" stroke="#C7D2FE" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <line x1="130" y1="315" x2="215" y2="300" stroke="#C7D2FE" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- Right Book Page -->
    <path d="M408 366 C352 340, 294 350, 256 376 L256 246 C294 220, 352 210, 408 236 Z" fill="url(#pageRight)" />
    <!-- Right Page Subtle Lines -->
    <line x1="282" y1="250" x2="382" y2="265" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <line x1="287" y1="275" x2="382" y2="290" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <line x1="297" y1="300" x2="382" y2="315" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- Book Spine Glow -->
    <path d="M254 246 L258 246 L258 378 L254 378 Z" fill="#6366F1" />
  </g>

  <!-- Glowing AI Diamond / Spark radiating from book center -->
  <g filter="url(#starGlow)">
    <!-- Main 4-point Diamond Star -->
    <path d="M256 100 Q256 175 190 175 Q256 175 256 250 Q256 175 322 175 Q256 175 256 100 Z" fill="url(#starGrad)" />
    
    <!-- Mini Secondary Sparkle (top right) -->
    <path d="M345 115 Q345 135 328 135 Q345 135 345 155 Q345 135 362 135 Q345 135 345 115 Z" fill="#FDE047" opacity="0.9" />

    <!-- Mini Sparkle (bottom left) -->
    <path d="M165 200 Q165 212 154 212 Q165 212 165 224 Q165 212 176 212 Q165 212 165 200 Z" fill="#38BDF8" opacity="0.9" />

    <!-- Brilliant Core Center -->
    <circle cx="256" cy="175" r="11" fill="#FFFFFF" />
    <circle cx="256" cy="175" r="5" fill="#FEF08A" />
  </g>

  <!-- Glowing Bookmark Ribbon -->
  <path d="M251 376 L251 416 L256 410 L261 416 L261 376 Z" fill="#F59E0B" />
</svg>
